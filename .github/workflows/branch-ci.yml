name: Branch CI
run-name: Signed validation · ${{ inputs.buildVariant }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      buildVariant:
        description: 'Select Build Variant'
        required: true
        default: 'healfiRelease'
        type: choice
        options:
          - healfiRelease
          - healfiDebug
          - fullRelease
          - fullDebug
          - aapsclientRelease
          - aapsclientDebug
          - aapsclient2Release
          - aapsclient2Debug
          - pumpcontrolRelease
          - pumpcontrolDebug

permissions:
  contents: read

concurrency:
  group: signed-validation-${{ github.ref }}-${{ inputs.buildVariant }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate signed AAPS candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AAPS_BUILD_VARIANT: ${{ inputs.buildVariant }}
    steps:
      - name: Checkout selected source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare existing signing key in private temporary files
        env:
          KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/ci/signed_validation.py prepare
      - name: Test food entry, profile calculator, command queue and radio drivers
        run: python3 tools/ci/signed_validation.py test
      - name: Build candidate with the existing signing key
        run: python3 tools/ci/signed_validation.py build
      - name: Collect sanitized test reports
        if: always()
        run: python3 tools/ci/signed_validation.py reports
      - name: Verify signature, assets and 16 KiB native library compatibility
        run: python3 tools/ci/signed_validation.py verify
      - name: Remove private signing files
        if: always()
        run: python3 tools/ci/signed_validation.py cleanup
      - name: Upload candidate and public verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aaps-signed-validation-${{ inputs.buildVariant }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aaps-validation-artifact/*.apk
            ${{ runner.temp }}/aaps-validation-artifact/validation.json
            ${{ runner.temp }}/aaps-validation-artifact/tests.json
            ${{ runner.temp }}/aaps-validation-artifact/junit.xml
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
